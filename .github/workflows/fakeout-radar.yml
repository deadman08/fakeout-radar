name: Fakeout Radar
on:
  workflow_dispatch:
  push:
    paths: ['site/**','scanner/**','.github/workflows/fakeout-radar.yml']
  schedule:
    - cron: '*/5 * * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: pip install -r scanner/requirements.txt
      - name: Scan markets
        run: python scanner/scan.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
